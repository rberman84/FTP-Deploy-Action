name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Change if using another branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ftp.yourdomain.com  # Replace with your actual FTP server
          username: your-ftp-username  # Replace with your Hostinger FTP username
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./  # Adjust if needed
          server-dir: /public_html/  # Change this if your site is in a subdirectory
